run-name: spring-boot-actions
on: [push]
jobs:
  spring-boot-tests :
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: "set up Java JDK 25"
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: "run tests"
        run: mvn clean test -Dtest=*Test -Dspring.profiles.active=test # runs only the test classes and uses the 'test' profile active
